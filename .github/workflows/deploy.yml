name: Deploy

# Deploys only after CI (lint, build, Docker + Trivy, Terraform) passes on main.
# Manual runs can redeploy any earlier commit on main, which is the rollback path.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy (rollback). Empty = latest main."
        required: false
        default: ""

# Never run two deploys at once, and never cancel one mid-sync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit CI verified (or the requested rollback ref).
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      id-token: write # request the GitHub OIDC token
      contents: read
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Short-lived credentials via OIDC; no long-lived AWS keys in GitHub.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-portfolio-${{ github.run_id }}

      # Order matters for zero-downtime deploys:
      #   1. upload new hashed assets (old ones stay, so cached HTML keeps working)
      #   2. upload index.html + other un-hashed files, pruning stale non-asset files
      #   3. prune assets no longer referenced by the new build
      - name: Upload hashed assets (immutable, 1y)
        run: |
          aws s3 sync dist/assets "s3://${BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html and other files (no-cache)
        run: |
          aws s3 sync dist "s3://${BUCKET}" \
            --exclude "assets/*" \
            --cache-control "no-cache" \
            --delete

      - name: Prune stale assets
        run: |
          aws s3 sync dist/assets "s3://${BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text
