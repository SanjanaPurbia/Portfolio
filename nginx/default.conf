# Served by nginx-unprivileged (non-root) inside the container.

# Cache policy keyed on the final URI: Vite emits content-hashed files under
# /assets/, so they can be cached forever. Everything else (index.html, SPA
# routes, favicon, resume) must revalidate so new deploys are picked up.
# Using a map keeps all add_header directives at server level; nginx drops
# inherited add_header values in any location that declares its own.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # Compression
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # Caching + security headers (applied to every response, including errors)
    add_header Cache-Control           $cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' for styles only: framer-motion animates via inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Liveness probe for Docker / orchestrators
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets: a miss is a real 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
